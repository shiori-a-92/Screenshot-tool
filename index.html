<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>スクショ編集ツール</title>
<style>
  :root{
    --pink:#ff7eb6;
    --pink-deep:#ff4f9a;
    --pink-soft:#ffe3f1;
    --pink-soft2:#fff5fa;
    --ink:#5b3a4a;
    --line:#ffc7e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:linear-gradient(160deg,var(--pink-soft2),var(--pink-soft));
    color:var(--ink);
    min-height:100vh;
  }
  header{
    text-align:center;
    padding:18px 12px 6px;
  }
  header h1{
    margin:0;
    font-size:20px;
    letter-spacing:.04em;
  }
  header p{
    margin:4px 0 0;
    font-size:12px;
    color:var(--pink-deep);
  }
  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:12px;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 12px;
    box-shadow:0 4px 14px rgba(255,126,182,.18);
    margin-bottom:12px;
  }
  .group{
    display:flex;
    gap:6px;
    align-items:center;
    padding-right:8px;
    border-right:1px dashed var(--line);
  }
  .group:last-child{border-right:none;}
  button.tool, .btn{
    border:1px solid var(--line);
    background:var(--pink-soft2);
    color:var(--ink);
    border-radius:10px;
    padding:7px 11px;
    font-size:13px;
    cursor:pointer;
    transition:.15s;
  }
  button.tool:hover, .btn:hover{background:var(--pink-soft);}
  button.tool.active{
    background:var(--pink);
    color:#fff;
    border-color:var(--pink-deep);
    box-shadow:0 2px 8px rgba(255,79,154,.4);
  }
  .btn.primary{
    background:var(--pink-deep);
    color:#fff;
    border-color:var(--pink-deep);
  }
  .btn.primary:hover{background:#ff3088;}
  label.lbl{font-size:12px;color:var(--pink-deep);}
  input[type=range]{accent-color:var(--pink-deep);width:90px;}
  input[type=color]{
    width:32px;height:32px;border:1px solid var(--line);
    border-radius:8px;background:#fff;cursor:pointer;padding:2px;
  }
  .stage{
    position:relative;
    background:
      linear-gradient(45deg,#fde9f3 25%,transparent 25%),
      linear-gradient(-45deg,#fde9f3 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#fde9f3 75%),
      linear-gradient(-45deg,transparent 75%,#fde9f3 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
    border:2px dashed var(--line);
    border-radius:16px;
    min-height:320px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    padding:14px;
  }
  .stage.drag{border-color:var(--pink-deep);background-color:#fff0f7;}
  #canvas{
    max-width:100%;
    border-radius:8px;
    box-shadow:0 6px 20px rgba(255,126,182,.25);
    cursor:crosshair;
    display:none;
  }
  .empty{
    text-align:center;
    color:var(--pink-deep);
    font-size:14px;
    line-height:1.9;
  }
  .empty .big{font-size:40px;}
  .hint{
    text-align:center;
    font-size:11px;
    color:#c98aa8;
    margin-top:10px;
  }
  kbd{
    background:#fff;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font-size:11px;color:var(--pink-deep);
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--pink-deep);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13px;box-shadow:0 6px 18px rgba(255,79,154,.45);
    opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toolbar.disabled{opacity:.45;pointer-events:none;}
</style>
</head>
<body>
<header>
  <h1>🖍️ スクショ編集ツール</h1>
  <p>枠線・四角・矢印・文字・ぼかしを入れて、PNG保存 or コピー！</p>
</header>

<div class="wrap">
  <div class="toolbar" id="toolbar">
    <div class="group">
      <button class="btn" id="pickFile">📁 画像を選ぶ</button>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
    <div class="group" id="toolGroup">
      <button class="tool" data-tool="move">🖐 移動</button>
      <button class="tool active" data-tool="rect">⬛ 四角</button>
      <button class="tool" data-tool="arrow">➜ 矢印</button>
      <button class="tool" data-tool="text">🅰 文字</button>
      <button class="tool" data-tool="blur">🌫 ぼかし</button>
      <button class="tool" data-tool="border">🔲 枠線</button>
    </div>
    <div class="group">
      <input type="color" id="color" value="#ff4f9a" title="色" />
      <label class="lbl">太さ</label>
      <input type="range" id="width" min="1" max="12" value="3" />
    </div>
    <div class="group" id="blurCtl" style="display:none;">
      <label class="lbl">ぼかし強度</label>
      <input type="range" id="blurStrength" min="4" max="40" value="14" />
    </div>
    <div class="group">
      <button class="btn" id="undo">↩ 戻す</button>
      <button class="btn" id="clear">🗑 全消し</button>
    </div>
    <div class="group" style="border:none;">
      <button class="btn primary" id="download">⬇ ダウンロード</button>
      <button class="btn primary" id="copy">📋 コピー</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <div class="big">📸</div>
      ここに <kbd>Cmd/Ctrl + V</kbd> で貼り付け<br />
      または「📁 画像を選ぶ」／ドラッグ&ドロップ
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <div class="hint">
    🖐 移動ツールで置いた注釈をドラッグして動かせる ／ 文字ツールは画像をクリックで入力 ／ ぼかしは隠したい範囲をドラッグ ／ <kbd>Cmd/Ctrl + V</kbd> 貼り付け対応
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const empty = document.getElementById('empty');
  const toolbar = document.getElementById('toolbar');
  const colorInput = document.getElementById('color');
  const widthInput = document.getElementById('width');
  const blurCtl = document.getElementById('blurCtl');
  const blurStrength = document.getElementById('blurStrength');

  let baseImage = null;      // 元画像
  let baseCanvas = null;     // 元画像のみを描いたオフスクリーン（ぼかしのサンプル元）
  let shapes = [];           // 注釈の配列
  let tool = 'rect';
  let drawing = false;
  let start = null;
  let temp = null;
  let movingIndex = -1;   // 移動中の注釈インデックス
  let moveStart = null;   // ドラッグ開始位置
  let moveOrig = null;    // ドラッグ開始時の注釈の状態

  function updateCursor(){
    canvas.style.cursor = (tool==='move') ? 'move' : (tool==='text' ? 'text' : 'crosshair');
  }

  // 点と線分の距離（矢印のヒットテスト用）
  function distToSeg(p,x1,y1,x2,y2){
    const A=p.x-x1, B=p.y-y1, C=x2-x1, D=y2-y1;
    const dot=A*C+B*D, len=C*C+D*D;
    let t = len ? dot/len : 0;
    t = Math.max(0, Math.min(1, t));
    const xx=x1+t*C, yy=y1+t*D;
    return Math.hypot(p.x-xx, p.y-yy);
  }
  // 上にある注釈を優先してヒットテスト
  function hitTest(p){
    for(let i=shapes.length-1; i>=0; i--){
      const s = shapes[i];
      if(s.type==='border') continue;
      if(s.type==='rect' || s.type==='blur'){
        if(p.x>=s.x-6 && p.x<=s.x+s.w+6 && p.y>=s.y-6 && p.y<=s.y+s.h+6) return i;
      } else if(s.type==='text'){
        ctx.font = s.size + 'px -apple-system, "Noto Sans JP", sans-serif';
        const w = ctx.measureText(s.text).width;
        if(p.x>=s.x-4 && p.x<=s.x+w+4 && p.y>=s.y-4 && p.y<=s.y+s.size+4) return i;
      } else if(s.type==='arrow'){
        if(distToSeg(p, s.x1,s.y1,s.x2,s.y2) <= Math.max(8, s.width+6)) return i;
      }
    }
    return -1;
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  function setEnabled(on){
    toolbar.classList.toggle('disabled', !on);
    document.getElementById('pickFile').parentElement.classList.remove('disabled');
  }
  setEnabled(false);

  // ---- 画像読み込み ----
  function loadImage(src){
    const img = new Image();
    img.onload = ()=>{
      baseImage = img;
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      baseCanvas = document.createElement('canvas');
      baseCanvas.width = img.naturalWidth;
      baseCanvas.height = img.naturalHeight;
      baseCanvas.getContext('2d').drawImage(img,0,0);
      shapes = [];
      canvas.style.display = 'block';
      empty.style.display = 'none';
      setEnabled(true);
      redraw();
      toast('画像を読み込んだよ！');
    };
    img.src = src;
  }

  function handleFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => loadImage(e.target.result);
    reader.readAsDataURL(file);
  }

  document.getElementById('pickFile').addEventListener('click',()=>document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change',e=>handleFile(e.target.files[0]));

  // 貼り付け
  window.addEventListener('paste',e=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const it of items){
      if(it.type.startsWith('image/')){ handleFile(it.getAsFile()); e.preventDefault(); return; }
    }
  });

  // ドラッグ&ドロップ
  ['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.remove('drag');}));
  stage.addEventListener('drop',e=>{
    const f = e.dataTransfer.files[0];
    if(f) handleFile(f);
  });

  // ---- ツール選択 ----
  document.querySelectorAll('.tool').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      tool = b.dataset.tool;
      blurCtl.style.display = (tool==='blur') ? 'flex' : 'none';
      if(tool==='border'){ addBorder(); }
      updateCursor();
    });
  });

  function addBorder(){
    // 既存の枠線は1本だけにする
    shapes = shapes.filter(s=>s.type!=='border');
    shapes.push({type:'border', color:colorInput.value, width:parseInt(widthInput.value,10)});
    redraw();
  }

  // ---- 座標変換 ----
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY) - r.top;
    return { x: cx * (canvas.width/r.width), y: cy * (canvas.height/r.height) };
  }

  // ---- 描画 ----
  function drawShape(s){
    if(s.type==='border'){
      ctx.lineWidth = s.width;
      ctx.strokeStyle = s.color;
      const o = s.width/2;
      ctx.strokeRect(o,o,canvas.width-s.width,canvas.height-s.width);
      return;
    }
    if(s.type==='rect'){
      ctx.lineWidth = s.width;
      ctx.strokeStyle = s.color;
      ctx.strokeRect(s.x,s.y,s.w,s.h);
      return;
    }
    if(s.type==='arrow'){
      drawArrow(s.x1,s.y1,s.x2,s.y2,s.color,s.width);
      return;
    }
    if(s.type==='text'){
      ctx.fillStyle = s.color;
      ctx.font = s.size + 'px -apple-system, "Noto Sans JP", sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(s.text, s.x, s.y);
      return;
    }
    if(s.type==='blur'){
      applyBlur(s.x,s.y,s.w,s.h,s.strength);
      return;
    }
  }

  function drawArrow(x1,y1,x2,y2,color,width){
    const head = Math.max(10, width*3.2);
    const ang = Math.atan2(y2-y1, x2-x1);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - head*Math.cos(ang - Math.PI/6), y2 - head*Math.sin(ang - Math.PI/6));
    ctx.lineTo(x2 - head*Math.cos(ang + Math.PI/6), y2 - head*Math.sin(ang + Math.PI/6));
    ctx.closePath();
    ctx.fill();
  }

  // モザイク状のぼかし（プライバシー保護向け）
  function applyBlur(x,y,w,h,strength){
    x = Math.round(x); y = Math.round(y);
    w = Math.round(w); h = Math.round(h);
    if(w<=0 || h<=0 || !baseCanvas) return;
    // はみ出し補正
    x = Math.max(0, Math.min(x, canvas.width));
    y = Math.max(0, Math.min(y, canvas.height));
    w = Math.min(w, canvas.width - x);
    h = Math.min(h, canvas.height - y);
    if(w<=0 || h<=0) return;
    const px = Math.max(2, Math.round(strength));
    const sw = Math.max(1, Math.round(w/px));
    const sh = Math.max(1, Math.round(h/px));
    const tmp = document.createElement('canvas');
    tmp.width = sw; tmp.height = sh;
    const tctx = tmp.getContext('2d');
    // 元画像から該当範囲を縮小コピー
    tctx.drawImage(baseCanvas, x,y,w,h, 0,0,sw,sh);
    // 拡大して貼り戻す（モザイク化）
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0,0,sw,sh, x,y,w,h);
    ctx.restore();
  }

  function redraw(){
    if(!baseImage) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(baseImage,0,0);
    // ぼかしを先に（元画像ベース）、その上に注釈
    shapes.filter(s=>s.type==='blur').forEach(drawShape);
    shapes.filter(s=>s.type!=='blur').forEach(drawShape);
    if(temp) drawShape(temp);
  }

  // ---- マウス操作 ----
  function down(e){
    if(!baseImage) return;
    const p = pos(e);
    if(tool==='move'){
      const idx = hitTest(p);
      if(idx>=0){
        movingIndex = idx;
        moveStart = p;
        moveOrig = JSON.parse(JSON.stringify(shapes[idx]));
        canvas.style.cursor = 'grabbing';
      }
      return;
    }
    if(tool==='text'){
      const txt = prompt('入れる文字は？');
      if(txt){
        const size = Math.max(14, parseInt(widthInput.value,10)*7);
        shapes.push({type:'text', x:p.x, y:p.y, text:txt, color:colorInput.value, size});
        redraw();
      }
      return;
    }
    if(tool==='border') return;
    drawing = true;
    start = p;
  }
  function move(e){
    if(tool==='move'){
      const p = pos(e);
      if(movingIndex<0){
        canvas.style.cursor = (hitTest(p)>=0) ? 'grab' : 'move';
        return;
      }
      const dx = p.x - moveStart.x, dy = p.y - moveStart.y;
      const s = shapes[movingIndex], o = moveOrig;
      if(s.type==='arrow'){
        s.x1=o.x1+dx; s.y1=o.y1+dy; s.x2=o.x2+dx; s.y2=o.y2+dy;
      } else {
        s.x=o.x+dx; s.y=o.y+dy;
      }
      redraw();
      return;
    }
    if(!drawing) return;
    const p = pos(e);
    const c = colorInput.value, w = parseInt(widthInput.value,10);
    if(tool==='rect'){
      temp = {type:'rect', x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y), color:c, width:w};
    } else if(tool==='arrow'){
      temp = {type:'arrow', x1:start.x, y1:start.y, x2:p.x, y2:p.y, color:c, width:w};
    } else if(tool==='blur'){
      temp = {type:'blur', x:Math.min(start.x,p.x), y:Math.min(start.y,p.y), w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y), strength:parseInt(blurStrength.value,10)};
    }
    redraw();
  }
  function up(e){
    if(tool==='move'){
      movingIndex = -1;
      updateCursor();
      return;
    }
    if(!drawing) return;
    drawing = false;
    if(temp){
      const minimal = (temp.w!==undefined) ? (temp.w<3 && temp.h<3) : (Math.abs(temp.x2-temp.x1)<3 && Math.abs(temp.y2-temp.y1)<3);
      if(!minimal) shapes.push(temp);
    }
    temp = null;
    redraw();
  }

  canvas.addEventListener('mousedown',down);
  canvas.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  canvas.addEventListener('touchstart',e=>{down(e);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',e=>{move(e);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchend',up);

  // ---- 操作ボタン ----
  document.getElementById('undo').addEventListener('click',()=>{ shapes.pop(); redraw(); });
  document.getElementById('clear').addEventListener('click',()=>{ shapes=[]; redraw(); toast('注釈を全部消したよ'); });

  document.getElementById('download').addEventListener('click',()=>{
    if(!baseImage){ toast('先に画像を読み込んでね'); return; }
    const a = document.createElement('a');
    a.download = 'screenshot-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('PNGを保存したよ！');
  });

  document.getElementById('copy').addEventListener('click',async()=>{
    if(!baseImage){ toast('先に画像を読み込んでね'); return; }
    try{
      const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('クリップボードにコピーしたよ！');
    }catch(err){
      toast('コピー非対応の環境かも…ダウンロードを使ってね');
    }
  });
})();
</script>
</body>
</html>
